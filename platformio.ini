[platformio]
default_envs = huidu_wf1

[env:huidu_wf1]
platform = espressif32@6.12.0
board = esp32-s2-saola-1
framework = arduino
board_build.flash_size = 4MB
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = watchdog_reset
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#6c7fc1e325cf2b1e5ca817ca4a07b45620aa63e9
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.2
    bblanchon/ArduinoJson@6.21.5
extra_scripts =
    pre:scripts/generate_build_time.py
    pre:scripts/backup_before_upload.py

